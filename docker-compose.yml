version: '3.9'

networks:
  incidents_net:

volumes:
  db_data:

services:
  db:
    image: postgres:16
    container_name: incidents_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incidents_db}
      POSTGRES_USER: ${POSTGRES_USER:-incidents_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incidents_pass}
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - incidents_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-incidents_user} -d ${POSTGRES_DB:-incidents_db} -h localhost -p 5432 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "scripts/run_migrations.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-incidents_user}:${POSTGRES_PASSWORD:-incidents_pass}@db:5432/${POSTGRES_DB:-incidents_db}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - incidents_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incidents_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-incidents_user}:${POSTGRES_PASSWORD:-incidents_pass}@db:5432/${POSTGRES_DB:-incidents_db}
      JWT_SECRET: \${JWT_SECRET:-L9k9M9W9bQXdd6cojXruU2pZTd7rsiAjpCB}
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    networks:
      - incidents_net
    healthcheck:
      test: ["CMD", "true"]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: incidents_web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"
    networks:
      - incidents_net
